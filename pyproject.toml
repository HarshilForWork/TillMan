[project]
name = "tillhand"
version = "0.1.0"
description = "Gives each D2C Merchant its own UCP-conformant MCP server, payment handler and server-side authorization."
authors = [
    { name = "Harshil", email = "harshilbhanushali11@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13,<3",
    "mcp==2.2.*",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "jsonschema[format-nongpl]>=4.23",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
